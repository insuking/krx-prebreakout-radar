name: Free US Full Market Radar
on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Universe offset for this batch'
        required: false
        default: '0'
      batch_size:
        description: 'Symbols to attempt (max 500)'
        required: false
        default: '100'
  schedule:
    - cron: '45 11 * * 2-6'
permissions:
  contents: write
concurrency:
  group: us-free-full-market
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "requests>=2.31"
      - name: Refresh current exchange universe
        run: python us_full_universe.py
      - name: Run 100-symbol quality-gated rollout
        env:
          US_SCAN_MANUAL_OFFSET: ${{ inputs.offset || '' }}
        run: python us_scan_runner.py
      - name: Merge scan batches and publish coverage
        run: python us_merge_free_scan.py
      - name: Publish verified-only candidates
        run: python us_publish_verified.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/us_universe/ site/us_full_scan/ site/us_radar/verified_recommendations.json
          if ! git diff --cached --quiet; then
            git commit -m "data: free US full-universe batch scan"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-free-full-market
          path: |
            site/us_full_scan/
            site/us_universe/universe.json
          if-no-files-found: warn
