name: KIS Samsung Daily Investor Flow
on:
  workflow_dispatch:
  schedule:
    - cron: '50 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: kis-samsung-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install "pandas>=2.0" "requests>=2.31"
      - name: Fetch confirmed Samsung investor daily data
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python kis_samsung_investor.py
      - name: Commit validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/kis_samsung/
          if ! git diff --cached --quiet; then
            git commit -m "data: update KIS Samsung daily investor flow"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kis-samsung-daily
          path: site/kis_samsung/
          if-no-files-found: warn
