name: KRX Radar mobile report
on:
  push:
    branches: [main]
    paths-ignore:
      - "history/**"
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 0-4'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run KRX scanner
        run: python radar.py
      - name: Update forward performance ledger
        run: python performance_tracker.py
      - name: Persist signal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/recommendations.csv
          git diff --cached --quiet || (git commit -m "Update daily signal history [skip ci]" && git push)
      - name: Build mobile dashboard
        run: python dashboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krx-radar-data
          path: site/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
