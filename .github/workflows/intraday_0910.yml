name: KRX 09:10 intraday observation
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * 1-5'
permissions:
  contents: write
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Verify KIS read-only access
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python kis_check.py
      - name: Observe public quotes (WATCH only)
        run: python intraday_0910.py
      - name: Archive observation
        run: |
          mkdir -p intraday
          cp site/intraday_0910.json intraday/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intraday/latest.json
          git diff --cached --quiet || (git commit -m "Record 09:10 public quote observations [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: intraday-0910-observation
          path: |
            site/intraday_0910.json
            site/kis_status.json
