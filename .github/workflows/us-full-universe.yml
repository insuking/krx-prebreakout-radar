name: US Full Universe Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 2-6'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "requests>=2.31"
      - name: Fetch current full US listed symbol universe
        run: python us_full_universe.py
      - name: Commit verified universe snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/us_universe/universe.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update US listed universe"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-full-universe
          path: site/us_universe/universe.json
          if-no-files-found: warn
