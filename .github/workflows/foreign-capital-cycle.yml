name: Foreign Capital Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 1-5'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install "pandas>=2.0" "pykrx>=1.0.48"
      - name: Collect validated investor flows
        run: python foreign_capital_cycle.py
      - name: Save CSV and JSON to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/foreign_cycle/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh foreign capital cycle"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foreign-capital-cycle
          path: site/foreign_cycle/
          if-no-files-found: warn
