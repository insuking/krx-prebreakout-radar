name: Foreign Capital Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 1-5'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install "pandas>=2.0" "pykrx>=1.0.48"
      - name: Collect investor flows (CSV fallback if KRX public endpoint fails)
        shell: bash
        run: |
          if python foreign_capital_cycle.py; then
            echo 'KRX public data collected'
          elif compgen -G 'data/foreign_cycle_import/*.csv' > /dev/null; then
            rm -rf site/foreign_cycle
            mkdir -p site/foreign_cycle
            echo 'KRX endpoint unavailable; importing user-supplied historical CSV'
            python import_foreign_cycle_csv.py
          else
            rm -rf site/foreign_cycle
            echo 'No validated data source available. Upload CSV files to data/foreign_cycle_import/.' >&2
            exit 1
          fi
      - name: Verify data freshness and source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/foreign_cycle/summary.json')
          if not p.exists(): raise SystemExit('Missing summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          if not x.get('stocks'): raise SystemExit('No valid stocks')
          print('SOURCE:', x.get('source'), 'STATUS:', x.get('status'), 'COUNT:', len(x['stocks']))
          PY
      - name: Analyze institutional and foreign co-movement
        run: python institutional_comovement.py
      - name: Save CSV and JSON to repository
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/foreign_cycle/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh foreign capital cycle"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foreign-capital-cycle
          path: site/foreign_cycle/
          if-no-files-found: warn
